<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151928" />
      <stop offset="50%" stop-color="#0E121E" />
      <stop offset="100%" stop-color="#06080F" />
    </linearGradient>

    <!-- Main Z Glow Gradient -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Ambient Shadow / Glow Behind Icon -->
  <rect x="80" y="80" width="352" height="352" rx="88" fill="url(#zGrad)" opacity="0.25" filter="url(#ambientGlow)" />

  <!-- Outer Rounded Squircle Base -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Subtle Grid Lines for Developer Aesthetic -->
  <path d="M 40 180 L 472 180 M 40 332 L 472 332 M 180 40 L 180 472 M 332 40 L 332 472" 
        stroke="rgba(255, 255, 255, 0.03)" stroke-width="1.5" />

  <!-- Central Monogram: Stylized Futuristic "Z" with Code Elements -->
  <!-- Back Glow of the Z -->
  <path d="M 140 162 L 372 162 L 230 350 L 372 350" 
        fill="none" stroke="url(#zGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Sharp Geometric "Z" Ribbon -->
  <!-- Top Horizontal Bar of the Z -->
  <path d="M 144 140 L 368 140 C 382 140 392 153 388 167 L 366 210 C 363 216 357 220 350 220 L 220 220 L 364 162 C 374 158 370 144 358 144 L 152 144 C 142 144 136 154 140 163 L 152 186 L 144 140 Z" 
        fill="url(#zGrad)" opacity="0.15" />

  <!-- Clean Precision Z Structure -->
  <g filter="url(#neonGlow)">
    <!-- Top Beam with Code Bracket Notch -->
    <path d="M 148 152 H 364 C 377 152 385 167 377 177 L 214 360 H 364 C 375 360 384 369 384 380 C 384 391 375 400 364 400 H 148 C 135 400 127 385 135 375 L 298 192 H 148 C 137 192 128 183 128 172 C 128 161 137 152 148 152 Z" 
          fill="url(#zGrad)" />

    <!-- Terminal Prompt / Code Diamond Accent (Interlocking with Z) -->
    <path d="M 330 260 L 375 295 L 330 330" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Underscore / Cursor -->
    <line x1="395" y1="330" x2="425" y2="330" 
          stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- Glowing Tech Dots (Code Nodes) -->
  <circle cx="148" cy="172" r="8" fill="#FFFFFF" opacity="0.9" />
  <circle cx="364" cy="380" r="8" fill="#FFFFFF" opacity="0.9" />
</svg>